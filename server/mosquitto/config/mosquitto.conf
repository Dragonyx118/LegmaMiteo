# ===========================================
# Mosquitto MQTT Broker Configuration
# OpenWeather Station — LegmaMiteo
# ===========================================

# --- Listener MQTT in chiaro (uso locale/interno) ---
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Listener MQTT su TLS (esposto pubblicamente via Tailscale Funnel) ---
# Il Funnel su porta 8443 inoltra qui il traffico grezzo; è Mosquitto
# stesso a terminare il TLS con il certificato Tailscale/Let's Encrypt,
# non Tailscale (il Funnel in modalità --tcp non decifra nulla).
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
certfile /mosquitto/config/server.crt
keyfile /mosquitto/config/server.key

# --- Future LoRaWAN listener (ready, disabled) ---
# listener 1884
# protocol mqtt

# --- Persistence ---
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# --- Performance ---
max_keepalive 60
max_packet_size 65536