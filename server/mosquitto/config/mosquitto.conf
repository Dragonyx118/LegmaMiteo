# ===========================================
# Mosquitto MQTT Broker Configuration
# OpenWeather Station — LegmaMiteo
# ===========================================

# --- Listener ---
listener 1883
allow_anonymous true

# --- Future LoRaWAN listener (ready, disabled) ---
# listener 1884
# protocol mqtt

# --- Persistence ---
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# --- Performance ---
max_keepalive 60
max_packet_size 65536