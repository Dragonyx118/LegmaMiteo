# ===========================================
# Telegraf Configuration
# OpenWeather Station — LegmaMiteo
# ===========================================

[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "legmamiteo-server"

# --- Input: MQTT (WiFi stations) ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "station/+/base",
    "station/+/mod-air",
    "station/+/mod-storm",
    "station/+/mod-wind",
    "station/+/mod-hydro",
    "station/+/mod-soil",
    "station/+/mod-snow",
    "station/+/mod-fire"
  ]
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "unix"
  name_override = "weather_station"

# --- Input: LoRaWAN (future — ready but disabled) ---
# [[inputs.mqtt_consumer]]
#   servers = ["tcp://mosquitto:1884"]
#   topics = ["lorawan/+/#"]
#   data_format = "json"
#   json_time_key = "timestamp"
#   json_time_format = "unix"
#   name_override = "weather_station_lora"

# --- Output: InfluxDB ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "legmamiteo"
  bucket = "stations"