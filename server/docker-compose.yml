# ===========================================
# Docker Compose — LegmaMiteo Server
# OpenWeather Station
# ===========================================

services:

  # --- Tailscale sidecar (espone Mosquitto via Funnel) ---
  tailscale:
    image: tailscale/tailscale:latest
    container_name: legmamiteo-tailscale
    hostname: legmamiteo-server
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--accept-dns=false --reset
      - TS_SERVE_CONFIG=/config/serve-config.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./tailscale/serve-config.json:/config/serve-config.json:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    networks:
      - legmamiteo-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: legmamiteo-mosquitto
    user: root
    network_mode: "service:tailscale"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    depends_on:
      - tailscale

  telegraf:
    image: telegraf:1.30
    container_name: legmamiteo-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - legmamiteo-network

  # --- Time Series Database ---
  influxdb:
    image: influxdb:2.7
    container_name: legmamiteo-influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - legmamiteo-network

  # --- Dashboard ---
  grafana:
    image: grafana/grafana:10.4.0
    container_name: legmamiteo-grafana
    network_mode: "service:tailscale"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=legmamiteo-server.tail1c95b4.ts.net
      - GF_SERVER_ROOT_URL=https://legmamiteo-server.tail1c95b4.ts.net/
    depends_on:
      - tailscale
      - influxdb
    restart: unless-stopped
  # --- Telegram Notification Bot ---
  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: legmamiteo-telegram-bot
    env_file:
      - ./telegram-bot/.env
    environment:
      - INFLUX_URL=http://influxdb:8086
    depends_on:
      - influxdb
    restart: unless-stopped
    networks:
      - legmamiteo-network
      
  # --- REST API Backend ---
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: legmamiteo-api
    network_mode: "service:tailscale"
    env_file:
      - .env
    depends_on:
      - tailscale
      - influxdb
      - mosquitto
    restart: unless-stopped

networks:
  legmamiteo-network:
    name: legmamiteo-network

volumes:
  grafana-data:
  tailscale-state:

