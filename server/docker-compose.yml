# ===========================================
# Docker Compose — LegmaMiteo Server
# OpenWeather Station
# ===========================================

services:

  # --- Tailscale sidecar (espone Mosquitto via Funnel) ---
  tailscale:
    image: tailscale/tailscale:latest
    container_name: legmamiteo-tailscale
    hostname: legmamiteo-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=legmamiteo-server
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    networks:
      - legmamiteo-network

  # --- MQTT Broker (condivide network stack con tailscale per il Funnel) ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: legmamiteo-mosquitto
    user: root
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - legmamiteo-network

  telegraf:
    image: telegraf:1.30
    container_name: legmamiteo-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - legmamiteo-network

  # --- Time Series Database ---
  influxdb:
    image: influxdb:2.7
    container_name: legmamiteo-influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - legmamiteo-network

  # --- Dashboard ---
  grafana:
    image: grafana/grafana:10.4.0
    container_name: legmamiteo-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - influxdb
    restart: unless-stopped
    networks:
      - legmamiteo-network

  # --- REST API Backend ---
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: legmamiteo-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - influxdb
      - mosquitto
    restart: unless-stopped
    networks:
      - legmamiteo-network

networks:
  legmamiteo-network:
    name: legmamiteo-network

volumes:
  grafana-data:
  tailscale-state: